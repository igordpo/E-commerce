<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Kick Society</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <img src="image/logo.png" alt="Kick Society Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Buscar tênis raros, marcas...">
                <button type="button">🔍</button>
            </div>
            <nav class="nav-menu">
                <a href="cadastro.html" class="active">Cadastro</a>
                <a href="index.html">Início</a>
                <a href="#">Lançamentos</a>
                <a href="#">Streetwear</a>
                <a href="#">Contato</a>
            </nav>
            <div class="cart-icon-container">
                <a href="carrinho.html" class="cart-link">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-badge">3</span>
                </a>
            </div>
        </div>
    </header>

    <section class="cart-banner">
        <div class="banner-content">
            <img src="image/banner_cadastro.jpg" alt="Faça seu cadastro e ganhe benefícios exclusivos">
        </div>
    </section>

    <main class="container checkout-page">
        <form class="checkout-form" action="#" method="POST">
            
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="form-group">
                    <label for="full-name">Nome Completo *</label>
                    <input type="text" id="full-name" required placeholder="Ex: João Silva Costa">
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required placeholder="exemplo@email.com">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
                </div>

                <div class="form-group">
                    <label for="phone">Telefone / WhatsApp *</label>
                    <input type="tel" id="phone" required placeholder="(11) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="birth-date">Data de Nascimento *</label>
                    <input type="date" id="birth-date" required>
                </div>

                <div class="form-group">
                    <label for="password">Criar Senha *</label>
                    <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label for="avatar">Foto de Perfil (Opcional)</label>
                    <input type="file" id="avatar" accept="image/*">
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço de Entrega</legend>

                <div class="form-group">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" required placeholder="00000-000">
                </div>

                <div class="form-group">
                    <label for="street">Rua/Logradouro *</label>
                    <input type="text" id="street" required placeholder="Ex: Av. Paulista">
                </div>

                <div class="form-group">
                    <label for="number">Número *</label>
                    <input type="text" id="number" required placeholder="123">
                </div>

                <div class="form-group">
                    <label for="complement">Complemento</label>
                    <input type="text" id="complement" placeholder="Ex: Apto 42">
                </div>

                <div class="form-group">
                    <label for="neighborhood">Bairro *</label>
                    <input type="text" id="neighborhood" required placeholder="Ex: Centro">
                </div>

                <div class="form-group">
                    <label for="city">Cidade *</label>
                    <input type="text" id="city" required placeholder="Ex: São Paulo">
                </div>

                <div class="form-group">
                    <label for="state">Estado *</label>
                    <select id="state" required>
                        <option value="" disabled selected>Selecione seu Estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Forma de Pagamento</legend>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="pix" checked>
                        <span class="payment-box">
                            <span class="icon">📱</span> Pix
                        </span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="cartao">
                        <span class="payment-box">
                            <span class="icon">💳</span> Cartão de Crédito
                        </span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="boleto">
                        <span class="payment-box">
                            <span class="icon">📄</span> Boleto
                        </span>
                    </label>
                </div>
            </fieldset>

            <div class="form-terms">
                <label>
                    <input type="checkbox" required> Aceito os Termos de Uso e Políticas do E-commerce.
                </label>
            </div>

            <button type="submit" class="btn-submit-checkout">Concluir Cadastro e Pagar</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Kick Society. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
